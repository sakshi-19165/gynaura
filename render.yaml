services:
  - type: web
    name: gynaura-web
    runtime: python
    plan: free
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "20.18.0"
      - key: MONGODB_DB_NAME
        value: "gynaura"
      - key: MONGODB_URI
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DOCTOR_EMAILS
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
